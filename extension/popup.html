<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, Arial, sans-serif; width: 320px; padding: 12px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  p { font-size: 12px; color: #555; margin: 4px 0 10px; }
  code { background: #eee; padding: 1px 4px; border-radius: 3px; }
  button { width: 100%; padding: 8px; font-size: 13px; cursor: pointer; margin-bottom: 8px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { font-size: 12px; white-space: pre-wrap; min-height: 60px; max-height: 200px; overflow-y: auto; background: #f4f4f4; border-radius: 4px; padding: 8px; }
  .warn { color: #b45309; }
</style>
</head>
<body>
  <h1>IMDb Top250 Scraper</h1>
  <p>Open <code>imdb.com/chart/top</code> or <code>imdb.com/chart/toptv</code> in this tab first. If IMDb shows a "Human Verification" page, solve it yourself in the tab, then click Scrape.</p>
  <button id="scrapeBtn">Scrape This Page</button>
  <p class="warn">Keep this popup open until it finishes (scrolling to load 250 items can take ~30-60s).</p>
  <div id="status">Idle.</div>
  <script src="popup.js"></script>
</body>
</html>
